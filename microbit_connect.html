<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>micro:bit 體感星際戰機</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    button {
      padding: 10px 14px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    #connectBtn { background-color: #3b82f6; color: white; }
    #connectBtn:disabled { background-color: #1e3a8a; color: #94a3b8; }
    #calibrateBtn { background-color: #10b981; color: white; }
    #restartBtn { background-color: #f59e0b; color: #0f172a; display: none; }
    
    .status-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
      background: #1e293b;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .score-highlight { color: #38bdf8; font-weight: bold; font-size: 15px; }

    /* 遊戲畫布容器 */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 3 / 4;
      background: #020617;
      border: 2px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 遊戲結束遮罩 */
    #gameOverOverlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    #gameOverOverlay h2 { color: #ef4444; font-size: 32px; margin: 0 0 10px 0; }
    #finalScore { font-size: 20px; margin-bottom: 20px; }

    /* 底部版號顯示 */
    .version-footer {
      margin-top: 12px;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="header">
    <button id="connectBtn">連接 micro:bit</button>
    <button id="calibrateBtn">校準水平中心</button>
  </div>

  <div class="status-bar">
    <span id="bleStatus">藍牙：未連線 (可用方向鍵/Z/X試玩)</span>
    <span>分數：<span id="scoreDisplay" class="score-highlight">0</span></span>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="480" height="640"></canvas>
    
    <div id="gameOverOverlay">
      <h2>戰機墜毀</h2>
      <div id="finalScore">最終分數：0</div>
      <button id="restartBtn" style="display:inline-block; padding: 12px 28px; font-size: 16px;">重新開始</button>
    </div>
  </div>

  <!-- 底部版本號標示 -->
  <div class="version-footer">Version 1.0 - Starfighter BLE</div>

  <script>
    // ================= 藍牙設定區 =================
    const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const UART_TX_CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    let bluetoothDevice = null;
    let rxTextBuffer = '';

    // 原始加速度與校準基準點
    let rawAccX = 0, rawAccY = 0;
    let offsetX = 0, offsetY = 0;

    const connectBtn = document.getElementById('connectBtn');
    const calibrateBtn = document.getElementById('calibrateBtn');
    const bleStatus = document.getElementById('bleStatus');

    connectBtn.addEventListener('click', async () => {
      try {
        bleStatus.innerText = '藍牙：搜尋中...';
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'BBC micro:bit' }],
          optionalServices: [UART_SERVICE_UUID]
        });
        bluetoothDevice.addEventListener('gattserverdisconnected', () => {
          bleStatus.innerText = '藍牙：已斷線';
          connectBtn.disabled = false;
        });

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(UART_SERVICE_UUID);
        const characteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleBleData);

        bleStatus.innerText = '藍牙：已連線 (' + bluetoothDevice.name + ')';
        connectBtn.disabled = true;
      } catch (err) {
        bleStatus.innerText = '藍牙：連線取消或失敗';
      }
    });

    // 將目前手持角度設為靜止中心點
    calibrateBtn.addEventListener('click', () => {
      offsetX = rawAccX;
      offsetY = rawAccY;
    });

    function handleBleData(event) {
      const decoder = new TextDecoder('utf-8');
      rxTextBuffer += decoder.decode(event.target.value);

      while (rxTextBuffer.includes('\n')) {
        const idx = rxTextBuffer.indexOf('\n');
        const msg = rxTextBuffer.slice(0, idx).trim();
        rxTextBuffer = rxTextBuffer.slice(idx + 1);

        if (msg === 'A') {
          fireSingleMissile();
        } else if (msg === 'B') {
          fireTripleMissile();
        } else if (msg.startsWith('P:')) {
          const coords = msg.slice(2).split(',');
          if (coords.length === 2) {
            rawAccX = parseInt(coords[0], 10) || 0;
            rawAccY = parseInt(coords[1], 10) || 0;
          }
        }
      }
    }

    // ================= 遊戲引擎區 =================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScoreText = document.getElementById('finalScore');
    const restartBtn = document.getElementById('restartBtn');

    let score = 0;
    let isGameOver = false;
    let frameCount = 0;

    // 戰機狀態
    const player = {
      x: canvas.width / 2,
      y: canvas.height - 80,
      width: 36,
      height: 44,
      vx: 0,
      vy: 0
    };

    let missiles = [];
    let meteors = [];
    let stars = Array.from({ length: 40 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      speed: 1 + Math.random() * 2,
      size: 1 + Math.random() * 2
    }));

    // 鍵盤備用控制（方便電腦無藍牙時測試）
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.key === 'z' || e.key === 'Z') fireSingleMissile();
      if (e.key === 'x' || e.key === 'X') fireTripleMissile();
    });
    window.addEventListener('keyup', e => keys[e.key] = false);

    // 按鍵 A：向前發射 1 枚導彈
    function fireSingleMissile() {
      if (isGameOver) return;
      missiles.push({
        x: player.x,
        y: player.y - 22,
        vx: 0,
        vy: -10,
        color: '#38bdf8'
      });
    }

    // 按鍵 B：向前、左前、右前發射 3 枚導彈
    function fireTripleMissile() {
      if (isGameOver) return;
      const speed = 10;
      const angle = 22 * (Math.PI / 180); // 左右偏轉 22 度

      // 正前方
      missiles.push({ x: player.x, y: player.y - 22, vx: 0, vy: -speed, color: '#facc15' });
      // 左前方
      missiles.push({ x: player.x - 10, y: player.y - 16, vx: -Math.sin(angle) * speed, vy: -Math.cos(angle) * speed, color: '#facc15' });
      // 右前方
      missiles.push({ x: player.x + 10, y: player.y - 16, vx: Math.sin(angle) * speed, vy: -Math.cos(angle) * speed, color: '#facc15' });
    }

    function spawnMeteor() {
      const radius = 16 + Math.random() * 18;
      meteors.push({
        x: radius + Math.random() * (canvas.width - radius * 2),
        y: -radius,
        radius: radius,
        vy: 2.5 + Math.random() * 2.5 + Math.min(score / 200, 4), // 隨分數微幅加速
        vx: (Math.random() - 0.5) * 1.5
      });
    }

    function update() {
      if (isGameOver) return;
      frameCount++;

      // 1. 計算實際加速度（扣除校準偏移）
      let effectiveX = rawAccX - offsetX;
      let effectiveY = rawAccY - offsetY;

      // 死區過濾（避免平放微震）
      if (Math.abs(effectiveX) < 60) effectiveX = 0;
      if (Math.abs(effectiveY) < 60) effectiveY = 0;

      // 將加速度轉換為戰機速度（靈敏度係數 0.014）
      let targetVx = effectiveX * 0.014;
      let targetVy = effectiveY * 0.014;

      // 支援電腦鍵盤疊加
      if (keys['ArrowLeft']) targetVx = -6;
      if (keys['ArrowRight']) targetVx = 6;
      if (keys['ArrowUp']) targetVy = -6;
      if (keys['ArrowDown']) targetVy = 6;

      // 速度平滑插值（消除藍牙傳輸間隔的頓挫感，達成 60fps 絲滑移動）
      player.vx += (targetVx - player.vx) * 0.35;
      player.vy += (targetVy - player.vy) * 0.35;

      player.x += player.vx;
      player.y += player.vy;

      // 限制戰機不飛出畫面邊界
      player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
      player.y = Math.max(30, Math.min(canvas.height - 30, player.y));

      // 2. 更新背景星空
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
      });

      // 3. 更新導彈位置
      for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i];
        m.x += m.vx;
        m.y += m.vy;
        if (m.y < -10 || m.x < -10 || m.x > canvas.width + 10) {
          missiles.splice(i, 1);
        }
      }

      // 4. 生成與更新隕石
      if (frameCount % 45 === 0) {
        spawnMeteor();
      }

      for (let i = meteors.length - 1; i >= 0; i--) {
        const met = meteors[i];
        met.x += met.vx;
        met.y += met.vy;

        // 檢查隕石是否撞擊戰機
        const distToPlayer = Math.hypot(met.x - player.x, met.y - player.y);
        if (distToPlayer < met.radius + 14) {
          triggerGameOver();
          return;
        }

        // 檢查導彈是否擊中隕石
        let hit = false;
        for (let j = missiles.length - 1; j >= 0; j--) {
          const m = missiles[j];
          if (Math.hypot(met.x - m.x, met.y - m.y) < met.radius + 6) {
            missiles.splice(j, 1);
            hit = true;
            score += 10;
            scoreDisplay.innerText = score;
            break;
          }
        }

        if (hit || met.y > canvas.height + met.radius) {
          meteors.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 繪製星空
      ctx.fillStyle = '#64748b';
      stars.forEach(s => {
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // 繪製導彈
      missiles.forEach(m => {
        ctx.fillStyle = m.color;
        ctx.beginPath();
        ctx.arc(m.x, m.y, 4.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 繪製隕石
      meteors.forEach(met => {
        ctx.fillStyle = '#78716c';
        ctx.strokeStyle = '#a8a29e';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(met.x, met.y, met.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });

      // 繪製戰機（三角形機身 + 引擎火焰）
      ctx.save();
      ctx.translate(player.x, player.y);
      
      // 引擎火焰
      ctx.fillStyle = frameCount % 6 < 3 ? '#f97316' : '#facc15';
      ctx.beginPath();
      ctx.moveTo(-7, 18);
      ctx.lineTo(7, 18);
      ctx.lineTo(0, 28 + Math.random() * 6);
      ctx.closePath();
      ctx.fill();

      // 機身
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(0, -22);
      ctx.lineTo(-18, 18);
      ctx.lineTo(0, 12);
      ctx.lineTo(18, 18);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function triggerGameOver() {
      isGameOver = true;
      finalScoreText.innerText = '最終分數：' + score;
      gameOverOverlay.style.display = 'flex';
    }

    restartBtn.addEventListener('click', () => {
      score = 0;
      scoreDisplay.innerText = '0';
      missiles = [];
      meteors = [];
      player.x = canvas.width / 2;
      player.y = canvas.height - 80;
      player.vx = 0;
      player.vy = 0;
      isGameOver = false;
      gameOverOverlay.style.display = 'none';
    });

    // 啟動遊戲迴圈
    gameLoop();
  </script>
</body>
</html>
